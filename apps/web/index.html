<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Controle de estoque e inventário: saldo, movimentos e contagens rastreáveis." />

    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('invexa-theme');
          var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(escuro ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- iOS: instalação como app de tela inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Invexa" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Android/Chrome legado -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Invexa — inventário exato</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
