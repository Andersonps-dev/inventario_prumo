server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — qualquer rota não encontrada como arquivo cai pro index.html
    # (react-router-dom cuida do roteamento no cliente a partir daí).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do build do Vite têm hash no nome — cache longo é seguro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
