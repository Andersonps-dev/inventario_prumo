# Nome do projeto Compose fixado em "prumo" de propósito — os containers,
# rede e (principalmente) o volume postgres_data já existentes em produção
# foram criados sob esse nome. Sem isso, rodar `docker compose up` de dentro
# de /opt/invexa (diretório renomeado no servidor) faria o Compose derivar
# o nome do projeto do diretório ("invexa") e criar um stack paralelo do
# zero — containers novos e um banco vazio — em vez de atualizar o real.
name: prumo

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://prumo:${POSTGRES_PASSWORD}@postgres:5432/prumo?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - PORT=3000
      - CORS_ORIGIN=https://${DOMAIN}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - invexa-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - invexa-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=prumo
      - POSTGRES_USER=prumo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - invexa-net
    # Sem "ports:" publicado no host — só acessível de dentro da rede docker
    # (api/web), diferente de um Postgres de dev exposto na máquina local.

networks:
  # external — o Nginx compartilhado do host (do outro projeto) entra nesta
  # rede também, pra conseguir alcançar "api"/"web" pelo nome do serviço.
  # Renomeada de prumo-net — o compose do quitei que entra aqui por nome
  # precisa ser atualizado no mesmo deploy, senão o proxy dele para de achar
  # os containers (ver checklist de deploy).
  invexa-net:
    name: invexa-net

volumes:
  postgres_data:
